server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hmdp?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 858518
  cloud:
    sentinel:
      transport:
        # 作用：指定我们刚刚在本地启动的 Sentinel Dashboard 控制台的地址和端口
        dashboard: localhost:8083
        # 作用：Sentinel 客户端与控制台交互的本地端口，如果8719被占用，会自动+1往后扫描
        port: 8719
      # 作用：取消Sentinel的懒加载。默认为true，即只有被请求一次后才会将接口展示在控制台。设为false可以提早注册
      eager: true
  redis:
    host: 192.168.150.101
    port: 6379
    password: 123321
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  rabbitmq:
    host: 192.168.150.101
    port: 5672
    username: tjxt
    password: 123321
    virtual-host: /
    listener:
      simple:
        # 手动 ACK，确保消息不会因为程序异常而丢失
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
    template:
      channel-transacted: true # 开启事务特性
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS